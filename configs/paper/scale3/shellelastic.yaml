inherit: ../common.yaml
run: {name: scale3_shellelastic}
model:
  type: shell
  vocab_size: 50432
  seq_len: 2048
  n_layers: 32
  base_width: 256
  supported: [4, 5, 6, 7, 8]
  head_dim: 128
  ffn_hidden: 1024
  gated_attention: true
  norm: rms
  norm_eps: 1.0e-05
  trunk_norm: group
  terminal_norm: full
  separate_terminal_norms: true
  readout: separate
  readout_scaling: init_lr
  residual_scale: 1.0
  parameterization: mu_elastic
  init_std: 0.0033
  alpha: learnable
  ffn_expansion: 4.0
  width_multiplier: 2.0
  internal_scaling: true
  trained: [4, 5, 6, 7, 8]
  stage_grad_scale: 1.0
  width_router: false
  width_router_hidden: 256
  matmul: slab
  fused_norm: true
objective:
  z_loss: 0.0001
  loss_weights: [1, 1, 1, 1, 4]
  selection: all
optim:
  lr: 0.00141
  weight_decay: 0.00707
  betas: [0.975, 0.975]
  eps: 1.41e-14
schedule: {decay_start: 85000}
data: {batch_size: 32, eval_batch_size: 32}
train: {steps: 100000, shard_size: 8, activation_checkpointing: 1/1, val_every: 5000}
