inherit: ../common.yaml
run: {name: scale3_matformer}
model:
  type: dense
  vocab_size: 50432
  seq_len: 2048
  n_layers: 32
  mode: ffn
  base_width: 1024
  supported: [16, 24, 34, 45, 57]
  head_dim: 128
  ffn_hidden: 256
  gated_attention: true
  norm: rms
  norm_eps: 1.0e-05
  residual_scale: 1.0
  readout_scaling: init_lr
  parameterization: mu_elastic
  init_std: 0.0033
  alpha: learnable
  ffn_expansion: 0.25
  width_multiplier: 8.0
  internal_scaling: true
  trained: [16, 24, 34, 45, 57]
objective:
  z_loss: 0.0001
  loss_weights: [1, 1, 1, 1, 1]
  selection: random
optim:
  lr: 0.00141
  weight_decay: 0.00707
  betas: [0.975, 0.975]
  eps: 1.41e-14
schedule: {decay_start: 85000}
data: {batch_size: 32, eval_batch_size: 32}
train: {steps: 100000, shard_size: 8, activation_checkpointing: 1/1, val_every: 5000}
