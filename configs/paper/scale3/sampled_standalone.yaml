inherit: ../common.yaml
run: {name: scale3_sampled_standalone}
model:
  type: shell
  vocab_size: 50432
  seq_len: 2048
  n_layers: 32
  base_width: 832
  supported: [1]
  head_dim: 64
  ffn_hidden: 6032
  gated_attention: true
  norm: rms
  norm_eps: 1.0e-05
  trunk_norm: group
  terminal_norm: full
  readout: separate
  readout_scaling: init_lr
  residual_scale: 1.0
  parameterization: mu_elastic
  init_std: 0.0033
  alpha: 1.0
  ffn_expansion: 7.25
  width_multiplier: 6.5
  internal_scaling: true
  matmul: pad
objective: {z_loss: 0.0001}
optim:
  lr: 0.00316
  weight_decay: 0.0158
  betas: [0.875, 0.875]
  eps: 6.32e-15
schedule: {decay_start: 85000}
data: {batch_size: 32, eval_batch_size: 32}
train: {steps: 100000, shard_size: 8, activation_checkpointing: 1/1, val_every: 5000}
multi:
  selection: random
  models:
  - name: standalone_d832
    model: {}
  - name: standalone_d960
    model: {base_width: 960, ffn_hidden: 6960, width_multiplier: 7.5}
  - name: standalone_d1088
    model: {base_width: 1088, ffn_hidden: 7888, width_multiplier: 8.5}
  - name: standalone_d1216
    model: {base_width: 1216, ffn_hidden: 8816, width_multiplier: 9.5}
  - name: standalone_d1344
    model: {base_width: 1344, ffn_hidden: 9744, width_multiplier: 10.5}
