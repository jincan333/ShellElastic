inherit: ../common.yaml
run: {name: scale2_standalone_d1088}
model:
  type: shell
  vocab_size: 50432
  seq_len: 2048
  n_layers: 32
  base_width: 1088
  supported: [1]
  head_dim: 64
  ffn_hidden: 2992
  gated_attention: true
  norm: rms
  norm_eps: 1.0e-05
  trunk_norm: group
  terminal_norm: full
  readout: separate
  readout_scaling: init_lr
  residual_scale: 1.0
  parameterization: mu_elastic
  init_std: 0.0033
  alpha: 1.0
  ffn_expansion: 2.75
  width_multiplier: 8.5
  internal_scaling: true
  matmul: pad
objective: {z_loss: 0.0001}
optim:
  lr: 0.002
  weight_decay: 0.01
  betas: [0.95, 0.95]
  eps: 1.0e-14
schedule: {decay_start: 40000}
data: {batch_size: 32, eval_batch_size: 32}
train: {steps: 50000, shard_size: 4, activation_checkpointing: 1/2, val_every: 5000}
